<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Engine Room Press — 10 Gods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Newsreader:wght@400&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --ink:#14171A; --blue:#173B4E; --paper:#F7F6F1; --signal:#C1440E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:2560px; }
  body { background:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased; }
  .cover { position:relative; width:1600px; height:2560px; padding:100px 100px 110px;
            display:flex; flex-direction:column; color:var(--paper); }
  .grid { position:absolute; inset:0; pointer-events:none; opacity:.10;
     background-image:
       repeating-linear-gradient(to right, rgba(247,246,241,.9) 0 1px, transparent 1px 50px),
       repeating-linear-gradient(to bottom, rgba(247,246,241,.9) 0 1px, transparent 1px 50px); }
  .rail { position:relative; display:flex; justify-content:space-between; align-items:baseline;
           font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:34px;
           line-height:50px; letter-spacing:.16em; text-transform:uppercase; }
  /* the signature device: red tag, leader line, label — pointing at the title */
  .callout { position:relative; display:flex; align-items:center; gap:26px;
              margin-top:0; margin-bottom:50px;
              font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:34px;
              line-height:50px; letter-spacing:.14em; text-transform:uppercase; }
  .callout .tag { background:var(--signal); color:var(--paper);
                   padding:8px 20px; line-height:34px; }
  .callout .line { flex:1; height:1px; background:rgba(247,246,241,.45); }
  h1 { position:relative; font-family:"Space Grotesk",sans-serif; font-weight:700;
        font-size:360px; line-height:.92; letter-spacing:-0.025em;
        text-transform:uppercase; margin-bottom:50px; }
  .sp-a { flex:0 0 750px; }
  .sp-b { flex:1 1 0; }
  h1 .the { display:block; font-size:.42em; letter-spacing:.02em;
             color:rgba(247,246,241,.55); margin-bottom:.06em; }
  .deck { position:relative; font-family:Newsreader,Georgia,serif; font-weight:400;
           font-size:52px; line-height:1.42; color:rgba(247,246,241,.78);
           max-width:26ch; }
  .foot { position:relative; padding-top:49px; display:flex;
           justify-content:space-between; align-items:baseline;
           border-top:1px solid rgba(247,246,241,.45);
           font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:32px;
           line-height:50px; letter-spacing:.16em; text-transform:uppercase;
           color:rgba(247,246,241,.7); }
</style></head>
<body><div style="font:500 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;background:#14171A;padding:11px 16px;text-align:center"><a href="../" style="color:#F7F6F1;text-decoration:none">&larr; Back to everything</a></div><div class="cover">
  <div class="grid"></div>
  <div class="rail"><span>Engine Room Press</span><span>No. 10 / 16</span></div>
  <div class="sp-a"></div>
  <div class="callout"><span class="tag">10</span><span class="line"></span><span>Part III &middot; Stories</span></div>
  <h1>Gods</h1>
  <p class="deck">How a story nobody can check moved millions of people the same way.</p>
  <div class="sp-b"></div>
  <div class="foot"><span>The Essential Sixteen</span><span>Coming soon</span></div>
</div></body></html>
