<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Engine Room Press — 13 Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --ink:#14171A; --blue:#173B4E; --paper:#F7F6F1; --signal:#C1440E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:2560px; }
  body { background:var(--blue); overflow:hidden; -webkit-font-smoothing:antialiased; }
  .cover { position:relative; width:1600px; height:2560px; padding:100px 100px 110px;
            display:flex; flex-direction:column; color:var(--paper); }
  /* SECTION HATCH - 45-degree hairlines, the drafting convention for a surface
     that has been cut open. Picked 2026-09-03 over six other textures because it
     is the only one still visible at 96px, which is feed and thumbnail size.
     It replaces the flat 50px grid, which vanished at thumbnail and read as a
     plain slab. The 50px module still governs the 100/100/110 padding. */
  .grid { position:absolute; inset:0; pointer-events:none;
     background-image:
       repeating-linear-gradient(45deg, rgba(247,246,241,.075) 0 1.5px, transparent 1.5px 18px); }
  .sp-a { flex:1.15 1 0; }
  .sp-b { flex:1 1 0; }
  h1 { position:relative; font-family:"Space Grotesk",sans-serif; font-weight:700;
        font-size:420px; line-height:.90; letter-spacing:-0.03em;
        text-transform:uppercase; }
  h1 .the { display:block; font-size:.30em; letter-spacing:.01em; line-height:1;
             color:rgba(247,246,241,.50); margin-bottom:.10em; }
  .foot { position:relative; padding-top:49px; display:flex;
           justify-content:space-between; align-items:center;
           border-top:1px solid rgba(247,246,241,.40);
           font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:32px;
           line-height:50px; letter-spacing:.16em; text-transform:uppercase;
           color:rgba(247,246,241,.70); }
  .foot .tag { background:var(--signal); color:var(--paper);
                padding:0 20px; line-height:50px; letter-spacing:.14em; }
</style></head>
<body><div style="font:500 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;background:#14171A;padding:11px 16px;text-align:center"><a href="../" style="color:#F7F6F1;text-decoration:none">&larr; Back to everything</a></div><div class="cover">
  <div class="grid"></div>
  <div class="sp-a"></div>
  <h1><span class="the">The</span>Map</h1>
  <div class="sp-b"></div>
  <div class="foot"><span class="tag">13</span><span>Engine Room Press</span></div>
</div></body></html>
