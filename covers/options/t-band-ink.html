<!doctype html><html lang=en><head><meta charset=utf-8>
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@500&display=block" rel=stylesheet>
<style>
 :root{--ink:#14171A;--blue:#173B4E;--paper:#F7F6F1;--signal:#C1440E}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1600px;height:2560px}
 body{background:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
 .cover{position:relative;width:1600px;height:2560px;padding:100px 100px 110px;
   display:flex;flex-direction:column;color:var(--paper);overflow:hidden}
 .sp-a{flex:1.15 1 0} .sp-b{flex:1 1 0}
 h1{position:relative;font-family:"Space Grotesk",sans-serif;font-weight:700;
   font-size:340px;line-height:.90;letter-spacing:-0.03em;text-transform:uppercase}
 h1 .the{display:block;font-size:.30em;letter-spacing:.01em;line-height:1;
   color:rgba(247,246,241,.50);margin-bottom:.10em}
 .foot{position:relative;padding-top:49px;display:flex;justify-content:space-between;
   align-items:center;border-top:1px solid rgba(247,246,241,.40);
   font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:32px;line-height:50px;
   letter-spacing:.16em;text-transform:uppercase;color:rgba(247,246,241,.70)}
 .foot .tag{background:var(--signal);color:var(--paper);padding:0 20px;line-height:50px;
   letter-spacing:.14em}
 .tex{position:absolute;inset:0;opacity:.07;background-image:
      repeating-linear-gradient(to right, rgba(247,246,241,.9) 0 1px, transparent 1px 50px),
      repeating-linear-gradient(to bottom, rgba(247,246,241,.9) 0 1px, transparent 1px 50px);}
   .band{position:absolute;left:0;right:0;top:0;height:1140px;
      background:rgba(247,246,241,.055);border-bottom:1px solid rgba(247,246,241,.30)}
</style></head><body><div class=cover>
 <div class=tex></div>
 <div class="band"></div>
 <div class=sp-a></div>
 <h1><span class="the">The</span>Surplus</h1>
 <div class=sp-b></div>
 <div class=foot><span class=tag>01</span><span>Engine Room Press</span></div>
</div></body></html>
