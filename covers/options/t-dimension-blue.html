<!doctype html><html lang=en><head><meta charset=utf-8>
<link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@500&display=block" rel=stylesheet>
<style>
 :root{--ink:#14171A;--blue:#173B4E;--paper:#F7F6F1;--signal:#C1440E}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1600px;height:2560px}
 body{background:var(--blue);overflow:hidden;-webkit-font-smoothing:antialiased}
 .cover{position:relative;width:1600px;height:2560px;padding:100px 100px 110px;
   display:flex;flex-direction:column;color:var(--paper);overflow:hidden}
 .sp-a{flex:1.15 1 0} .sp-b{flex:1 1 0}
 h1{position:relative;font-family:"Space Grotesk",sans-serif;font-weight:700;
   font-size:340px;line-height:.90;letter-spacing:-0.03em;text-transform:uppercase}
 h1 .the{display:block;font-size:.30em;letter-spacing:.01em;line-height:1;
   color:rgba(247,246,241,.50);margin-bottom:.10em}
 .foot{position:relative;padding-top:49px;display:flex;justify-content:space-between;
   align-items:center;border-top:1px solid rgba(247,246,241,.40);
   font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:32px;line-height:50px;
   letter-spacing:.16em;text-transform:uppercase;color:rgba(247,246,241,.70)}
 .foot .tag{background:var(--signal);color:var(--paper);padding:0 20px;line-height:50px;
   letter-spacing:.14em}
 .tex{position:absolute;inset:0;opacity:.06;background-image:
      repeating-linear-gradient(to right, rgba(247,246,241,.9) 0 1px, transparent 1px 50px),
      repeating-linear-gradient(to bottom, rgba(247,246,241,.9) 0 1px, transparent 1px 50px);}
   .dim{position:absolute;left:100px;right:100px;top:1500px;height:1px;
        background:rgba(247,246,241,.45);}
   .dim:before,.dim:after{content:"";position:absolute;top:-24px;width:2px;height:48px;
        background:rgba(247,246,241,.45);}
   .dim:before{left:0}.dim:after{right:0}
   .dimlab{position:absolute;left:100px;top:1530px;font-family:"IBM Plex Mono",monospace;
        font-weight:500;font-size:30px;letter-spacing:.18em;color:rgba(247,246,241,.45);
        text-transform:uppercase}
   .ext{position:absolute;top:960px;width:1px;height:520px;background:rgba(247,246,241,.22)}
   .ext.l{left:100px}.ext.r{right:100px}
   .ctick{position:absolute;width:60px;height:60px;border:2px solid rgba(247,246,241,.30)}
   .ctick.tl{top:50px;left:50px;border-right:0;border-bottom:0}
   .ctick.tr{top:50px;right:50px;border-left:0;border-bottom:0}
</style></head><body><div class=cover>
 <div class=tex></div>
 <div class="ext l"></div><div class="ext r"></div>
      <div class="dim"></div><div class="dimlab">05 &middot; Writing</div>
      <div class="ctick tl"></div><div class="ctick tr"></div>
 <div class=sp-a></div>
 <h1>Writing</h1>
 <div class=sp-b></div>
 <div class=foot><span class=tag>05</span><span>Engine Room Press</span></div>
</div></body></html>
