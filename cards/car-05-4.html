<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Engine Room Press — The Dollar carousel, slide 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --ink:#14171A; --blue:#173B4E; --paper:#F7F6F1; --signal:#C1440E;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  body { background:var(--ink); overflow:hidden;
         -webkit-font-smoothing:antialiased; }
  .card { position:relative; width:1080px; height:1350px;
           padding:80px 80px 70px; display:flex; flex-direction:column;
           color:var(--paper); }
  .grid { position:absolute; inset:0; pointer-events:none; opacity:.10;
     background-image:
       repeating-linear-gradient(to right, rgba(247,246,241,.9) 0 1px, transparent 1px 40px),
       repeating-linear-gradient(to bottom, rgba(247,246,241,.9) 0 1px, transparent 1px 40px); }
  .rail { position:relative; display:flex; justify-content:space-between;
           align-items:baseline;
           font-family:"IBM Plex Mono",monospace; font-weight:500;
           font-size:26px; line-height:40px; letter-spacing:.16em;
           text-transform:uppercase; }
  .rail .no { color:var(--signal); }
  .callout { position:relative; display:flex; align-items:center; gap:20px;
              margin-top:120px; margin-bottom:40px;
              font-family:"IBM Plex Mono",monospace; font-weight:500;
              font-size:26px; line-height:40px; letter-spacing:.14em;
              text-transform:uppercase; }
  .callout .tag { background:var(--signal); color:var(--paper);
                   padding:7px 16px; line-height:26px; }
  .callout .line { flex:1; height:1px; background:rgba(247,246,241,.45); }
  h1 { position:relative; font-family:"Space Grotesk",sans-serif; font-weight:700;
        font-size:98px; line-height:1.02; letter-spacing:-0.02em;
        margin-bottom:auto; }
  h1 em { font-style:normal; color:var(--signal); }
  .foot { position:relative; padding-top:39px;
           border-top:1px solid rgba(247,246,241,.45);
           font-family:"IBM Plex Mono",monospace; font-weight:500;
           font-size:26px; line-height:40px; letter-spacing:.16em;
           text-transform:uppercase; color:rgba(247,246,241,.7); }
</style></head>
<body><div style="font:500 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;background:#14171A;padding:11px 16px;text-align:center"><a href="../" style="color:#F7F6F1;text-decoration:none">&larr; Back to everything</a></div><div class="card">
  <div class="grid"></div>
  <div class="rail"><span>Engine Room Press</span><span class="no">No. 05</span></div>
  <div class="callout"><span class="tag">4/4</span><span class="line"></span><span>THE BOOK &middot; The Dollar</span></div>
  <h1>Reserves, sanctions and exorbitant privilege, as a thing you can watch <em>working</em>.</h1>
  <div class="foot">Book 15 &middot; Coming soon &middot; Link in bio</div>
</div></body></html>
